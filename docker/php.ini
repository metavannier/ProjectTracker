; Project Time Tracker — PHP settings (on top of php.ini-production)
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
date.timezone = UTC
memory_limit = 256M
; Large enough to import a big JSON export
post_max_size = 32M
upload_max_filesize = 32M
max_execution_time = 60
zend.exception_ignore_args = On
opcache.enable = 1
opcache.validate_timestamps = 0
